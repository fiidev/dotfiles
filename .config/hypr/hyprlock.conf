# ────────────────────────────────────────────────────────────────────
#  「✦ HYPRLOCK CONFIG ✦ 」
# ────────────────────────────────────────────────────────────────────

# ── BACKGROUND ──────────────────────────────────────────────────────
background {
    monitor =
    path = /home/fiidev/walls/clouds.jpg
    blur_passes = 4
    blur_size = 10
    contrast = 1.05
    brightness = 0.85
    vibrancy = 0.35
    vibrancy_darkness = 0.1
}

# ── GENERAL ─────────────────────────────────────────────────────────
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
}

# ── TIME ────────────────────────────────────────────────────────────
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 80
    font_family = Plus Jakarta Sans Bold
    position = 0, 0
    halign = center
    valign = center
}

# ── DAY-MONTH-DATE ──────────────────────────────────────────────────
label {
    monitor = eDP-1
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Plus Jakarta Sans Bold
    position = 0, -80
    halign = center
    valign = center
}

# ── INPUT FIELD ─────────────────────────────────────────────────────
input-field {
    monitor =
    size = 260, 54
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.45)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Plus Jakarta Sans Bold
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
    fade_on_empty = true
}
